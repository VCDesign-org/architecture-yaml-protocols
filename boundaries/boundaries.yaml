boundaries:
  # Logger Boundaries
  - id: "b-logging-01"
    name: "operational-log-ownership"
    description: "運用ログ（Operational）は開発者だけでなく運用チーム（Ops）がオーナーシップを持つ"
    type: "ownership"
    derived_from_decisions: ["d-logging-01"]

  - id: "b-logging-02"
    name: "operational-log-cleanliness"
    description: "運用ログにスタックトレースを含めてはならない（デバッグログのみ可）"
    type: "prohibition"
    derived_from_decisions: ["d-logging-01"]
    constraints:
      python:
        forbidden_symbols: ["printStackTrace", "console.trace", "print"]
        allowed_scopes: ["logger.debug"]
    exception_protocol:
      decision_feedback_required: true
      approval_role: "Tech Lead"
      update_target: "decisions/d-logging-01.yaml"

  - id: "b-logging-03"
    name: "domain-event-integrity"
    description: "関数名をイベント名として使用してはならない（ドメインイベント名を使用する）"
    type: "prohibition"
    derived_from_decisions: ["d-logging-03"]

  - id: "b-memory-01"
    name: "direct-memory-management-prohibition"
    description: "メモリの直接管理（malloc/free等）を行ってはならない（スマートポインタ等を使用する）"
    type: "prohibition"
    derived_from_decisions: []
    constraints:
      c_cpp:
        forbidden_symbols: ["malloc", "free", "new", "delete"]
    exception_protocol:
      decision_feedback_required: true
      approval_role: "Architect"
      update_target: "decisions/d-memory-01.yaml"

  - id: "b-logging-04"
    name: "pii-privacy-protection"
    description: "PII（個人情報）をマスクせずに記録してはならない"
    type: "invariant"
    derived_from_decisions: ["d-logging-04"]

  - id: "b-logging-05"
    name: "log-offload-safety"
    description: "ログアーカイブは実行環境から分離されなければならない"
    type: "invariant"
    derived_from_decisions: ["d-logging-01"] # Related to purpose/lifecycle

  # API Boundaries
  - id: "b-api-01"
    name: "api-evolution-safety"
    description: "破壊的変更（Breaking Change）を予告なしに行ってはならない"
    type: "prohibition"
    derived_from_decisions: ["d-api-02"]

  - id: "b-api-02"
    name: "mutation-idempotency"
    description: "状態を変更する操作は冪等性が保証されなければならない"
    type: "invariant"
    derived_from_decisions: ["d-api-01"]

  - id: "b-api-03"
    name: "error-interoperability"
    description: "エラー応答は外部システムが解釈可能な標準形式でなければならない"
    type: "invariant"
    derived_from_decisions: ["d-api-03"]

  # Persistence Boundaries
  - id: "b-persistence-01"
    name: "data-persistence-integrity"
    description: "レコードの物理削除を行ってはならない"
    type: "prohibition"
    derived_from_decisions: ["d-persistence-04"]

  - id: "b-persistence-02"
    name: "resource-naming-convention"
    description: "リソースの命名はプロジェクトで定義された命名規則（Naming Convention）に準拠しなければならない"
    type: "invariant"
    derived_from_decisions: ["d-persistence-04"]

  - id: "b-persistence-03"
    name: "schema-change-control"
    description: "データベーススキーマへの直接変更（手動DDL）を行ってはならない"
    type: "prohibition"
    derived_from_decisions: ["d-persistence-05"]

  # Messaging Boundaries
  - id: "b-messaging-01"
    name: "message-processing-safety"
    description: "メッセージ処理は重複受信しても副作用がないようにしなければならない"
    type: "invariant"
    derived_from_decisions: ["d-messaging-01"]

  - id: "b-messaging-02"
    name: "contract-compatibility"
    description: "メッセージスキーマの互換性を破壊してはならない"
    type: "prohibition"
    derived_from_decisions: ["d-messaging-02"]

  # Release Boundaries
  - id: "b-release-01"
    name: "deployment-immutability"
    description: "リリース成果物はビルド後に変更されてはならない（Immutable Artifact）"
    type: "prohibition"
    derived_from_decisions: ["d-release-01"]

  - id: "b-release-02"
    name: "source-of-truth-protection"
    description: "承認プロセスを経ずに保護ブランチへ変更を加えてはならない"
    type: "prohibition"
    derived_from_decisions: ["d-release-01"]
